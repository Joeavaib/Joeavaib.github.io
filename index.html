<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bundeswehr Luftwaffe – Dienstgrade</title>

<style>
    :root {
        --bg: #f2f2f7;
        --card: #ffffff;
        --text: #111111;
        --muted: #6e6e73;
        --blue: #007aff;
        --green: #34c759;
        --orange: #ff9500;
        --sec: #d1d1d6;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #000000;
            --card: #1c1c1e;
            --text: #ffffff;
            --muted: #98989f;
            --sec: #3a3a3c;
        }
        .secondary { color: #fff; }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { padding: 20px 16px 12px; text-align: center; }
    h1 { font-size: 24px; margin: 0 0 5px; }
    .subtitle { color: var(--muted); font-size: 14px; }
    main { max-width: 900px; margin: auto; padding: 12px; }

    button {
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        color: white;
    }
    .primary { background: var(--blue); }
    .secondary { background: var(--sec); color: #111; }
    .good { background: var(--green); }
    .again { background: var(--orange); }

    .buttons {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    #quiz { display: none; }

    .quiz-card {
        background: var(--card);
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    .badge-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 300px;
        background: #eee;
        border-radius: 14px;
        padding: 16px;
    }
    #badge {
        max-width: 100%;
        max-height: 340px;
        width: auto;
        height: auto;
        border-radius: 6px;
        display: block;
    }

    #answer {
        visibility: hidden;
        font-size: 28px;
        font-weight: 700;
        margin: 18px 0 4px;
        min-height: 36px;
    }
    #group {
        visibility: hidden;
        color: var(--muted);
        margin-bottom: 18px;
        min-height: 22px;
    }
    #progress {
        color: var(--muted);
        text-align: center;
        margin-bottom: 10px;
        font-size: 14px;
    }

    #all {
        background: var(--card);
        padding: 12px;
        border-radius: 18px;
    }
    #original { width: 100%; border-radius: 12px; }
</style>
</head>

<body>

<header>
    <h1>Bundeswehr Luftwaffe</h1>
    <div class="subtitle">Dienstgrade &amp; Rangabzeichen</div>
</header>

<main>

    <div class="buttons">
        <button class="primary" onclick="startQuiz()">Lernmodus</button>
        <button class="secondary" onclick="showOriginal()">Rangtafel</button>
    </div>

    <!-- LERNMODUS -->
    <section id="quiz">
        <div id="progress"></div>

        <div class="quiz-card">
            <div class="badge-wrap">
                <img id="badge" alt="Rangabzeichen">
            </div>

            <div id="answer"></div>
            <div id="group"></div>

            <div class="buttons" id="btnReveal">
                <button class="primary" onclick="showAnswer()">Antwort zeigen</button>
            </div>

            <div class="buttons" id="btnRate" style="display:none">
                <button class="again" onclick="rate(false)">Nochmal</button>
                <button class="good" onclick="rate(true)">Gewusst</button>
            </div>
        </div>
    </section>

let deck = [];
let current = 0;
let known = 0;
let total = 0;

function shuffle(array) {
    const result = [...array];
    for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
}

function startQuiz() {
    deck = shuffle(ranks);   // zufällige Reihenfolge
    current = 0;
    known = 0;
    total = ranks.length;

    document.getElementById("all").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    loadCard();
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function drawBadge(rank) {
    document.getElementById("badge").src = rank.img;
}

function loadCard() {
    const rank = deck[current];

    document.getElementById("progress").textContent =
        `Gewusst: ${known} von ${total} · noch ${deck.length - current} Karte(n) offen`;

    const answer = document.getElementById("answer");
    const group = document.getElementById("group");
    answer.style.visibility = "hidden";
    group.style.visibility = "hidden";
    answer.textContent = rank.name;
    group.textContent = rank.group;

    document.getElementById("btnReveal").style.display = "flex";
    document.getElementById("btnRate").style.display = "none";

    drawBadge(rank);
}

function showAnswer() {
    document.getElementById("answer").style.visibility = "visible";
    document.getElementById("group").style.visibility = "visible";
    document.getElementById("btnReveal").style.display = "none";
    document.getElementById("btnRate").style.display = "flex";
}

/* Bewertung: nicht gewusste Karten kommen am Ende nochmal dran */
function rate(wasKnown) {
    if (wasKnown) {
        known++;
    } else {
        deck.push(deck[current]);
    }
    current++;

    if (current >= deck.length) {
        alert("Geschafft! Alle Dienstgrade sind gelernt. Die Reihenfolge wird neu gemischt.");
        startQuiz();
        return;
    }
    loadCard();
}

function showOriginal() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("all").style.display = "block";
}
</script>
